<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>클래스온 · 설치 확인</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main>
      <span class="badge">개발용 · 실제 학생에게 배포하지 마세요</span>
      <h1>클래스온 학생 도우미</h1>
      <p id="classroom">설치 파일을 확인하고 있습니다.</p>
      <div id="status" role="status">확인 중…</div>
      <button id="retry" type="button">설치 상태 다시 확인</button>
      <section>
        <h2>설치와 학급 등록은 별도입니다</h2>
        <p>
          이 버전은 확장을 불러올 수 있는지 확인하는 개발 빌드입니다. 서버 연결·학생 등록·사이트
          수집·잠금·공지·캡처·도움 요청 전송은 아직 제공하지 않습니다.
        </p>
        <p>
          개인정보나 교사 암호를 입력하지 마세요. 권한은 설치 진단에 필요한 저장소만 요청합니다.
          실제 제어 기능의 권한은 해당 기능을 구현할 때 별도로 검증합니다.
        </p>
      </section>
    </main>
    <script type="module" src="setup.js"></script>
  </body>
</html>
