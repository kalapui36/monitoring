<!DOCTYPE html>
<html>
<body style="text-align:center; font-family:sans-serif; padding:20px;">
  <p id="msg">파일을 준비 중입니다...<br>잠시만 기다려 주세요.</p>
  <div id="loader" style="margin:15px auto; border:4px solid #f3f3f3; border-top:4px solid #3498db; border-radius:50%; width:30px; height:30px; animation:spin 1s linear infinite;"></div>
  <script>
    google.script.run.withSuccessHandler(function(base64) {
      const link = document.createElement('a');
      link.href = 'data:application/zip;base64,' + base64;
      link.download = 'Chrome_Edu_Extension.zip';
      link.click();
      document.getElementById('msg').innerHTML = '<b style="color:#2ecc71;">✅ 생성 완료!</b><br>다운로드된 ZIP 파일을 학생들에게 배포하세요.';
      document.getElementById('loader').style.display = 'none';
    }).getZipData();
  </script>
  <style>@keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }</style>
</body>
</html>
